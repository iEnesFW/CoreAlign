services:
  postgres:
    image: postgres:17-alpine
    container_name: corealign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: corealign
    ports:
      - '5432:5432'
    volumes:
      - corealign-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d corealign']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  corealign-postgres-data:
