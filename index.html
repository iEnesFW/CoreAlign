              {
                "@type": "Question",
                "name": "Mevcut ERP ve Muhasebe sistemimizle entegre çalışabilir mi?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Evet. CoreAlign, çift yönlü REST API'leri ve hazır ETL (Extract, Transform, Load) şablonları sayesinde Logo Go/Tiger, Mikro, Netsis ve global SAP sistemleriyle gerçek zamanlı veya periyodik veri senkronizasyonu yapabilir. Bayileriniz sipariş girdiğinde cari fişler ve faturalar otomatik olarak mevcut muhasebe sisteminize işlenir."

              },
              {
                "@type": "Question",
                "name": "Bayi siparişlerindeki çizim hatalarını nasıl engelliyor?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "CoreAlign bünyesindeki Akıllı CAD Çizim motoru, sipariş aşamasında dinamik kurallar ve tolerans sınırlarını (cam kalınlık limitleri, rüzgar yükü dayanımları, maksimum kanat genişlikleri) anlık olarak denetler. Hatalı çizimler veya geçersiz ebatlar siparişe eklenemez; bayiye otomatik düzeltme önerisi sunulur. Böylece üretimde hatalı kesim riski sıfıra indirilir."
                }
              },
              {
                "@type": "Question",
                "name": "Veri güvenliği ve barındırma seçenekleri nelerdir?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "CoreAlign, çoklu kiracılı (multi-tenant) bulut mimarisinde kiracı seviyesinde mantıksal veri izolasyonu uygular. Tüm hassas veriler sunucu tarafında AES-256 ile şifrelenir. Kurumsal müşterilerimiz için verilerin Türkiye sınırları içindeki özel sunucularda veya kendi yerel veri merkezlerinde (On-Premise) barındırılması seçeneklerini de sunuyoruz."
                }
              },

                "@type": "Question",
                "name": "Stok ve üretim planlamasında (MRP) fırın kapasitesi nasıl optimize ediliyor?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "MRP modülümüz, sipariş ölçülerini alarak 2D Kesim Optimizasyonu algoritmasıyla plakaları en az fire verecek şekilde yerleştirir (fireyi %15'ten %1.2'ye düşürür). Ayrıca temperleme fırınlarının doluluk oranlarını cam ağırlık ve kalınlıklarına göre hesaplayarak pişirme döngülerini gruplar. Bu sayede fırın boş çalıştırılmaz, enerji maliyetlerinde ciddi tasarruf elde edilir."
                }
              },

                }
              },
              {
                "@type": "Question",
                "name": "Verilerimin sahibi kim? Aboneliği bırakırsam verilerime ne olur?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Verileriniz tümüyle size aittir; CoreAlign yalnızca işleyen taraftır. İstediğiniz an müşteri, ürün, sipariş, fatura ve muhasebe kayıtlarınızı standart formatlarda (CSV, Excel ve yapısal JSON) dışa aktarabilirsiniz. Aboneliğinizi sonlandırırsanız, tanımlı bir geçiş penceresinde tam veri dışa aktarımı sağlanır; saklama süresi dolduğunda veriler kalıcı olarak silinir. Verinizi rehin alan bir kilitlenme (vendor lock-in) yaratmıyoruz."
                }
              },
              {
                "@type": "Question",
                "name": "Mevcut sistemimizdeki verileri CoreAlign'e taşımak ne kadar sürer?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Geçiş yapılandırılmış bir süreçtir: önce cari hesap, ürün/stok kartları, açık siparişler ve açılış bakiyeleri eşlenir, ardından test ortamında doğrulanıp canlıya alınır. Hazır içe aktarma şablonları ve doğrulama kontrolleri sayesinde, hatalı veya eksik kayıtlar daha aktarım anında yakalanır. Onboarding ekibimiz eşleştirme ve mutabakatı sizinle birlikte yürütür; canlıya geçişi hafta sonu gibi düşük yoğunluklu bir pencerede planlarız."

                }

                }
