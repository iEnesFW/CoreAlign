name: ci

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test-frontend:
    name: Frontend (lint / typecheck / test / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache npm store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: i18n keys resolve
        run: npm run check:i18n

      - name: Unit tests (root vitest)
        run: npm test --if-present

      - name: Build customer-portal
        run: npm --prefix apps/customer-portal run build

      - name: Build b2b portal
        run: npm --prefix apps/b2b run build

      - name: Build tenant admin
        run: npm run build

      - name: Upload dist artifacts (for bundle-size-gate)
        uses: actions/upload-artifact@v4
        with:
          name: spa-dist
          path: |
            dist/**
            apps/customer-portal/dist/**
            apps/b2b/dist/**
          if-no-files-found: error
          retention-days: 1

  bundle-size-gate:
    name: Bundle size budget
    needs: lint-typecheck-test-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: spa-dist
          path: .

      - name: Check admin bundle
        run: node scripts/check-bundle-size.mjs --dist dist --allow-chunk AddressRegionFields --allow-chunk vendor-geo --allow-chunk GlassProjectDesignerPage

      - name: Check customer-portal bundle
        run: node scripts/check-bundle-size.mjs --dist apps/customer-portal/dist

      - name: Check b2b bundle
        run: node scripts/check-bundle-size.mjs --dist apps/b2b/dist

  backend-test:
    name: Backend (.NET 10 build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corealign_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d corealign_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=corealign_test;Username=postgres;Password=postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore CoreAlign.sln

      - name: Build
        run: dotnet build CoreAlign.sln -c Release --no-restore

      - name: Test
        run: dotnet test CoreAlign.sln -c Release --no-build --logger "trx;LogFileName=test_results.trx" --results-directory ./TestResults --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./TestResults/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  coverage-gate:
    name: Coverage gate
    needs: backend-test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: ./TestResults

      - name: Enforce coverage threshold
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: node scripts/check-coverage.mjs --threshold 60 --path ./TestResults

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        spa: [admin, customer-portal, b2b]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests for ${{ matrix.spa }}
        env:
          E2E_TARGET: ${{ matrix.spa }}
        run: npm run e2e -- --project=${{ matrix.spa }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.spa }}
          path: e2e/playwright-report
          if-no-files-found: warn

  security-scan:
    name: Security scan (secrets + dependency audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # NOTE: continue-on-error during initial rollout while the existing backlog
      # (committed .env, current advisory list) is triaged. Flip to blocking once
      # the baseline is clean so these become real gates (SOC2 CC7.1/CC8.1).
      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm dependency audit (root + mobile)
        continue-on-error: true
        run: |
          npm audit --audit-level=high
          npm --prefix mobile audit --audit-level=high

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: dotnet vulnerable packages
        continue-on-error: true
        run: |
          dotnet restore CoreAlign.sln
          dotnet list CoreAlign.sln package --vulnerable --include-transitive
