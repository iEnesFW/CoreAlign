<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CoreAlign — Cam ve imalat için bulut ERP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e1b4b" />
      <stop offset="0.55" stop-color="#312e81" />
      <stop offset="1" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#818cf8" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.7">
      <stop stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="1" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <g transform="translate(96, 150)">
    <rect width="96" height="96" rx="22" fill="url(#mark)" />
    <rect x="26" y="26" width="20" height="20" rx="3" fill="white" fill-opacity="0.95" />
    <rect x="50" y="50" width="20" height="20" rx="3" fill="white" fill-opacity="0.95" />
    <rect x="26" y="50" width="20" height="20" rx="3" fill="white" fill-opacity="0.55" />
  </g>

  <text x="216" y="218" font-family="Inter, system-ui, sans-serif" font-size="64" font-weight="800" letter-spacing="-2" fill="#ffffff">CoreAlign</text>

  <text x="98" y="330" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5" fill="#ffffff">Cam &amp; imalat için bulut ERP</text>

  <text x="98" y="392" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="500" fill="#c7d2fe">Tasarım, teklif, üretim, stok ve muhasebe — tek platformda.</text>

  <g font-family="Inter, system-ui, sans-serif" font-size="24" font-weight="700" fill="#e0e7ff">
    <g transform="translate(98, 460)">
      <rect width="150" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5" />
      <text x="75" y="36" text-anchor="middle">3D CAD</text>
    </g>
    <g transform="translate(266, 460)">
      <rect width="120" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5" />
      <text x="60" y="36" text-anchor="middle">CPQ</text>
    </g>
    <g transform="translate(404, 460)">
      <rect width="120" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5" />
      <text x="60" y="36" text-anchor="middle">MRP</text>
    </g>
    <g transform="translate(542, 460)">
      <rect width="170" height="56" rx="28" fill="#ffffff" fill-opacity="0.08" stroke="#818cf8" stroke-opacity="0.5" />
      <text x="85" y="36" text-anchor="middle">Muhasebe</text>
